---
- name: Configure host.
  hosts: all

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Include playbook configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

    - name: Set playbook machine profile.
      set_fact:
        playbook_machine_profile: >-
          {{
            playbook_machine_profile
            | default(lookup('env', 'PLAYBOOK_MACHINE_PROFILE'), true)
            | default(ansible_facts.hostname, true)
          }}
      tags: ['always']

    - name: Check for machine-specific configuration.
      stat:
        path: "{{ playbook_dir }}/config/machines/{{ playbook_machine_profile }}.yml"
      register: playbook_machine_config
      changed_when: false
      check_mode: false
      become: false
      tags: ['always']

    - name: Include machine-specific configuration.
      include_vars: "{{ playbook_machine_config.stat.path }}"
      when: playbook_machine_config.stat.exists
      tags: ['always']

    - name: Check Xcode license before Homebrew tasks.
      import_tasks: tasks/xcode-license.yml
      when: ansible_facts.system == 'Darwin'
      tags: ['always', 'homebrew']

    - name: Prompt for sudo password.
      import_tasks: tasks/become-password.yml
      when:
        - prompt_for_become_password | default(true)
        - ansible_become_password is not defined
      tags: ['always']

    - name: Trust configured Homebrew taps.
      import_tasks: tasks/homebrew-trust.yml
      when:
        - homebrew_trust_configured_taps | default(true)
        - (homebrew_taps | default([])) | length > 0
      tags: ['always', 'homebrew']

    - name: Prepare dotfiles for check mode.
      import_tasks: tasks/dotfiles-check-mode.yml
      when:
        - configure_dotfiles | default(true)
        - ansible_check_mode
      tags: ['dotfiles']

    - name: Ensure MAS CLI is available.
      import_tasks: tasks/mas-cli.yml
      when: ((mas_installed_apps | default([])) | length > 0) or ((mas_installed_app_ids | default([])) | length > 0)
      tags: ['mas']

  roles:
    - role: elliotweiser.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']
    - role: geerlingguy.mac.mas
      when: ((mas_installed_apps | default([])) | length > 0) or ((mas_installed_app_ids | default([])) | length > 0)
      tags: ['mas']
    - role: geerlingguy.mac.dock
      when: configure_dock
      tags: ['dock']

  handlers:
    - import_tasks: handlers/main.yml
      tags: ['dock']

  tasks:
    - import_tasks: tasks/dotfiles.yml
      when: configure_dotfiles
      tags: ['dotfiles']

    - import_tasks: tasks/mas-uninstall.yml
      when: (mas_profile_uninstalled_apps | default([])) | length > 0
      tags: ['mas']

    - import_tasks: tasks/dock-direct-cleanup.yml
      when:
        - configure_dock
        - (dockitems_force_remove | default([])) | length > 0
      tags: ['dock']

    - import_tasks: tasks/sudoers.yml
      when: configure_sudoers
      tags: ['sudoers']

    - import_tasks: tasks/terminal.yml
      when: configure_terminal
      tags: ['terminal']

    - import_tasks: tasks/osx.yml
      when: configure_osx
      tags: ['osx']

    - import_tasks: tasks/extra-packages.yml
      tags: ['extra-packages']

    - import_tasks: tasks/sublime-text.yml
      when: configure_sublime
      tags: ['sublime-text']

    - name: Run post-provision task files in a block.
      tags: ['post']
      block:
        - name: Run configured post-provision ansible task files.
          include_tasks: "{{ outer_item }}"
          loop_control:
            loop_var: outer_item
          with_fileglob: "{{ post_provision_tasks | default(omit) }}"
