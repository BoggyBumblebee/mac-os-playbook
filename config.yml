configure_sudoers: false
sudoers_custom_config: ''
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/boggybumblebee/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/workspace/github.com/boggybumblebee/dotfiles
dotfiles_files:
  - .zshrc
  - .gitignore
  - .inputrc
  - .osx
  - .vimrc

homebrew_installed_packages:
  - ansible
  - ansible-lint
  - aws-sam-cli
  - awscli
  - bash-completion
  - cirruslabs/cli/sshpass
  - cmake
  - diesel
  - dockutil
  - gh
  - git
  - go
  - golang-migrate
  - gops
  - goreleaser
  - htop
  - keith/formulae/ld64.lld
  - lld
  - make
  - mas
  - node
  - nvm
  - openai/tools/tart
  - pkgconf
  - postgresql@17
  - postgresql@18
  - pstree
  - ripgrep
  - smartmontools
  - thefuck
  - timescale/tap/timescaledb
  - vim
  - wget
  - xcodegen
  - yamllint
  - zsh-history-substring-search

homebrew_taps:
  - cargo-lambda/tap
  - cirruslabs/cli
  - keith/formulae
  - openai/tools
  - timescale/tap

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - bbedit
  - betterdisplay
  - bettermouse
  - firefox
  - jetbrains-toolbox
  - logi-options+
  - microsoft-auto-update
  - microsoft-office
  - onyx
  - paragon-ntfs
  - postman
  - steam
  - sublime-text
  - visual-studio-code
  - vlc
  - whatsapp

# See `geerlingguy.mas` role documentation for usage instructions.
mas_excluded_app_ids: []
mas_installed_apps: "{{ mas_app_catalog | rejectattr('id', 'in', mas_excluded_app_ids | default([])) | list }}"
mas_app_catalog:
