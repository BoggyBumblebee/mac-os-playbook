---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_terminal: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove:
  - Launchpad
  - Maps
  - Freeform
  - News
  - Podcasts
  - Keynote
  - Numbers
  - Pages
  - GarageBand

dockitems_excluded_names: []
dockitems_persist: "{{ dockitems_persist_all | rejectattr('name', 'in', dockitems_excluded_names | default([])) | list }}"
dockitems_persist_all:
  - name: "Mail"
    path: "/System/Applications/Mail.app/"
    pos: 1
  - name: "Safari"
    path: "/System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app/"
    pos: 2
  - name: "Calendar"
    path: "/System/Applications/Calendar.app/"
    pos: 3
