---
- name: Check whether Apple developer tools are selected.
  command:
    argv:
      - /usr/bin/xcode-select
      - -p
  register: xcode_select_path_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: false

- name: Require Xcode Command Line Tools before Homebrew tasks.
  fail:
    msg: >-
      Apple's Command Line Tools are not available yet. Run
      `xcode-select --install`, complete the installer, then rerun this
      playbook.
  when: xcode_select_path_check.rc != 0

- name: Check whether Apple compiler tools are available.
  command:
    argv:
      - /usr/bin/xcrun
      - --find
      - clang
  register: xcrun_clang_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: false

- name: Require usable Apple compiler tools before Homebrew tasks.
  fail:
    msg: >-
      Apple's Command Line Tools are selected at
      {{ xcode_select_path_check.stdout }}, but clang is not available through
      xcrun. Reinstall the tools with `xcode-select --install`, then rerun this
      playbook.
  when: xcrun_clang_check.rc != 0

- name: Check Xcode license status.
  command:
    argv:
      - /usr/bin/xcodebuild
      - -license
      - check
  register: xcode_license_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: false

- name: Accept selected Xcode license before Homebrew tasks.
  command:
    argv:
      - /usr/bin/xcodebuild
      - -license
      - accept
  become: true
  changed_when: true
  when:
    - xcode_license_check.rc != 0
    - xcode_accept_license | default(true) | bool
    - not ansible_check_mode
    - >-
      'requires Xcode' not in
      (
        (xcode_license_check.stderr | default('')) +
        (xcode_license_check.stdout | default(''))
      )

- name: Require accepted Xcode license before Homebrew tasks.
  fail:
    msg: >-
      Apple's Xcode license has not been accepted yet. If full Xcode is
      installed and selected, run `sudo xcodebuild -license accept`, then rerun
      this playbook. If Xcode is installed but not selected, first run
      `sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer`.
  when:
    - xcode_license_check.rc != 0
    - (not (xcode_accept_license | default(true) | bool)) or ansible_check_mode
    - >-
      'requires Xcode' not in
      (
        (xcode_license_check.stderr | default('')) +
        (xcode_license_check.stdout | default(''))
      )
