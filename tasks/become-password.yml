---
- name: Prompt for macOS account password.
  pause:
    prompt: >-
      Enter your macOS account password for sudo and Homebrew cask installers,
      then press Enter. Input is hidden, so the cursor will not move while you
      type
    echo: false
  register: become_password_prompt
  no_log: true
  become: false

- name: Store prompted macOS account password for become and Homebrew casks.
  set_fact:
    ansible_become_password: "{{ become_password_prompt.user_input }}"
  no_log: true
  become: false
