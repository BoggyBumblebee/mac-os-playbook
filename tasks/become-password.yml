---
- name: Explain hidden macOS password prompt.
  debug:
    msg:
      - "The next prompt needs your macOS account password for sudo and Homebrew cask installers."
      - "Input is hidden: type the password, press Enter, and wait for Ansible to continue."
  become: false

- name: Prompt for macOS account password.
  pause:
    prompt: "macOS account password"
    echo: false
  register: become_password_prompt
  no_log: true
  become: false

- name: Store prompted macOS account password for become and Homebrew casks.
  set_fact:
    ansible_become_password: "{{ become_password_prompt.user_input }}"
  no_log: true
  become: false
